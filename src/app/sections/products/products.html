<div class="container">
  <p class="kicker">Live today</p>
  <h2 id="products-title">Products you can use today.</h2>
  <ul class="products">
    @for (product of products; track product.name) {
      <li uiCard class="product">
        <article appProductEntry [product]="product"></article>
      </li>
    }
  </ul>
</div>
