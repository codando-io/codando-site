@for (stage of stages; track stage.title) {
  <li class="stage">
    <h3>{{ stage.title }}</h3>
    <dl class="stage-items">
      @for (item of stage.items; track item.name) {
        <div>
          <dt>{{ item.name }}</dt>
          <dd>{{ item.description }}</dd>
        </div>
      }
    </dl>
  </li>
}
