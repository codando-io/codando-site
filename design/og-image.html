<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Codando Open Graph image</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('../public/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../public/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(at 0% 0%, rgb(110 91 234 / 0.16) 0, transparent 50%),
          radial-gradient(at 0% 100%, rgb(167 139 250 / 0.12) 0, transparent 50%),
          radial-gradient(at 92% 40%, rgb(255 255 255 / 0.6) 0, transparent 50%), #f0eee9;
        color: #1c1830;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(28 24 48 / 0.04) 1px, transparent 0),
          linear-gradient(to bottom, rgb(28 24 48 / 0.04) 1px, transparent 0);
        background-size: 48px 48px;
      }

      .brand {
        position: absolute;
        top: 64px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand svg {
        width: 42px;
        height: 42px;
      }

      .kicker {
        position: absolute;
        top: 196px;
        left: 72px;
        padding: 7px 14px;
        border: 1px solid #ddd9d0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.72);
        color: #5038cf;
        font:
          500 14px/1.2 'JetBrains Mono',
          monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        position: absolute;
        top: 254px;
        left: 72px;
        width: 620px;
        font-size: 62px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .board {
        position: absolute;
        top: 128px;
        right: 72px;
        width: 400px;
        overflow: hidden;
        border: 1px solid #ddd9d0;
        border-radius: 18px;
        background: #ffffff;
        box-shadow:
          0 2px 4px rgb(28 24 48 / 0.04),
          0 24px 64px rgb(28 24 48 / 0.12);
      }

      .board-header,
      .board-summary {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 22px;
        background: #f7f6f2;
        color: #5a5470;
        font:
          400 15px/1.4 'JetBrains Mono',
          monospace;
      }

      .board-header {
        border-bottom: 1px solid #ddd9d0;
      }

      .board-summary {
        border-top: 1px solid #ddd9d0;
      }

      .dots {
        width: 9px;
        height: 9px;
        margin-right: 30px;
        border-radius: 50%;
        background: #c8c3b8;
        box-shadow:
          14px 0 #c8c3b8,
          28px 0 #c8c3b8;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        row-gap: 4px;
        padding: 18px 22px;
      }

      .row + .row {
        border-top: 1px solid #ddd9d0;
      }

      .name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .category {
        grid-column: 1 / -1;
        color: #5a5470;
        font-size: 17px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 5px 12px;
        border: 1px solid #ddd9d0;
        border-radius: 999px;
        color: #5a5470;
        font:
          500 14px/1.2 'JetBrains Mono',
          monospace;
      }

      .chip::before {
        content: '';
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .live::before {
        background: #10b981;
        box-shadow: 0 0 8px 1px rgb(16 185 129 / 0.45);
      }

      .dev::before {
        border: 1.5px solid #6e5bea;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1C1830" />
        <path
          d="M42.6 42.6A15 15 0 1 1 42.6 21.4"
          fill="none"
          stroke="#F0EEE9"
          stroke-width="7"
          stroke-linecap="round"
        />
        <circle cx="42.6" cy="21.4" r="6" fill="#F0EEE9" />
      </svg>
      Codando
    </div>
    <p class="kicker">Independent software company</p>
    <h1>We design and build software products, end to end.</h1>
    <div class="board">
      <p class="board-header"><span class="dots"></span>codando.io / products</p>
      <div class="row">
        <span class="name">Prumo</span><span class="chip dev">In development</span
        ><span class="category">Electoral transparency</span>
      </div>
      <div class="row">
        <span class="name">Agora</span><span class="chip live">Live</span
        ><span class="category">Federated chat, voice, and video</span>
      </div>
      <div class="row">
        <span class="name">Cenaculum</span><span class="chip live">Live</span
        ><span class="category">Screen-sharing rooms</span>
      </div>
      <p class="board-summary">2 live, 1 in development</p>
    </div>
  </body>
</html>
